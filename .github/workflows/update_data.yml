name: Update processed data

on:
  schedule:
    - cron: "0 */6 * * *"  # runs every 6 hours (UTC)
  workflow_dispatch:        # allows manual run from Actions tab

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # ✅ still needed for pushing to gh-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install Google Chrome 
        run: |
          sudo apt-get update 
          sudo apt-get install -y google-chrome-stable

      - name: Build C++ processor
        run: |
          mkdir -p build
          g++ -O2 -std=c++20 backend/logic.cpp -o build/logic

      - name: Run scraper
        run: |
          python backend/web_scraper.py

      - name: Run processor
        run: |
          # 🔑 CHANGE: write output JSON into a temporary folder (not React app)
          mkdir -p output
          ./build/logic backend/ipo_dashboard.json output/ipo_react.json

      # ❌ REMOVED: Commit/push step that updated main branch (caused Netlify redeploys)

      - name: Deploy JSON to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages   # ✅ separate branch, Netlify won't redeploy
          publish_dir: ./output      # ✅ only publish the folder with ipo_react.json
          keep_files: true           # ✅ keeps other files in gh-pages if you add more later
